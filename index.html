<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Senhas</title>
  <script>
   function redirecionar() {
      const lang = (navigator.language || '').toLowerCase();
      if (lang.startsWith('pt')) window.location.replace('pt_BR.html');
      else if (lang.startsWith('es')) window.location.replace('es_419.html');
      else if (lang.startsWith('zh')) window.location.replace('zh_CN.html');
      else if (lang.startsWith('ja')) window.location.replace('ja_JP.html');
      else window.location.replace('en_US.html');
    }
    redirecionar();
  </script>
</head>
<body>
  <main>
    <p>Redirecting... / Redirecionando...</p>
    <p>Se não funcionar, <a href="setLang.html">acesse setLang</a>.</p>
    <p>If it doesn't work, <a href="setLang.html">open setLang</a>.</p>
    <p>JavaScript is required.</p>
  </main>
</body>
</html>
